name: shop

# Общие настройки воркера: вставляются в каждый сервис через <<: *app
x-app: &app
  build: ./app
  depends_on:
    postgres:
      condition: service_healthy
  mem_limit: 200m
  cpus: 0.5
  restart: on-failure

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    <<: *app
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      INSTANCE_NAME: app1

  app2:
    <<: *app
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      INSTANCE_NAME: app2

  app3:
    <<: *app
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      INSTANCE_NAME: app3

  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3

  k6:
    image: grafana/k6
    profiles: ["test"]
    environment:
      BASE_URL: http://lb
    volumes:
      - ./k6:/scripts
    depends_on:
      - lb

volumes:
  pgdata: