name: shop

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      INSTANCE_NAME: app
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 200m
    cpus: 0.5
    restart: on-failure

  k6:
    image: grafana/k6
    profiles: ["test"]          # не запускается при docker compose up, только вручную
    environment:
      BASE_URL: http://app:8000
    volumes:
      - ./k6:/scripts
    depends_on:
      - app

volumes:
  pgdata: